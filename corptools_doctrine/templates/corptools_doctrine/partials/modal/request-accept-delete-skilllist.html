{% load i18n %}
{% load static %}

<!-- Approve Delete Request Modal -->
<div class="modal fade" id="corptools-request-skillplan-accept-delete" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title fs-5">
                    {% translate "Accept Delete request" %}
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button>
            </div>
            <div class="modal-body">
                {% translate "Are you sure you want to delete this Doctrine?" %}
            </div>
            <div class="modal-footer">
                <button id="modal-button-cancel-delete-request" type="button" class="btn btn-danger" data-bs-dismiss="modal">
                    <i class="fa-solid fa-hand"></i> {% translate "Cancel" %}
                </button>

                <button id="modal-button-confirm-delete-request" type="button" class="btn btn-success">
                    <i class="fa-solid fa-check"></i> {% translate "Confirm" %}
                </button>
            </div>
        </div>
    </div>
</div>
