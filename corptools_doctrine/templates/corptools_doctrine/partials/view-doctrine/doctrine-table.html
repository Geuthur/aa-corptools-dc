{% load i18n %}

<div class="card card-body mt-2 rounded">
    <!-- Category Filter -->
    <div class="mb-3">
        <div id="category-filter" class="d-flex flex-wrap gap-2">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="all-categories" checked>
                <label class="form-check-label" for="all-categories">
                    {% translate "All Categories" %}
                </label>
            </div>
        </div>
    </div>
    <!-- Doctrine Table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover w-100" id="doctrine-table">
            <thead>
                <th class="w-auto">{% trans "Character" %}</th>
                <th class="w-auto">{% trans "Doctrines" %}</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
